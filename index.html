<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vídeo y audio</title>
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { background: #f4efe8; color: #17222b; margin: 0; min-height: 100vh; padding: 32px 16px; }
    main { margin: auto; max-width: 900px; }
    h1 { font-size: clamp(2rem, 6vw, 4rem); margin: 0 0 28px; }
    section { background: #fff; border: 1px solid #ded9d2; border-radius: 8px; margin-top: 20px; padding: 20px; }
    h2 { font-size: 1.25rem; margin: 0 0 16px; }
    video { background: #10181e; display: block; max-height: 75vh; width: 100%; }
    audio { display: block; width: 100%; }
  </style>
</head>
<body>
  <main>
    <h1></h1>
    <section>
      <h2>Vídeo</h2>
      <video controls preload="metadata" playsinline>
        <source src="3D_lion_billboard_animation_20260918184946.mp4" type="video/mp4">
        Tu navegador no permite reproducir este vídeo.
      </video>
    </section>
    <section>
      <h2>Audio del león</h2>
      <audio controls preload="metadata">
        <source src="sonido-leon.mp3" type="audio/mpeg">
        Tu navegador no permite reproducir este audio.
      </audio>
    </section>
  </main>
</body>
</html>
