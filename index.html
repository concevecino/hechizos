<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vuelooooo mágico</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: radial-gradient(ellipse at 50% 120%, #1b2a4a 0%, #070b18 70%);
    overflow: hidden;
    font-family: Georgia, "Times New Roman", serif;
    color: #f4e4c1;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  /* Estrellas de fondo */
  .estrellas {
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(2px 2px at 20% 30%, #fff, transparent),
      radial-gradient(1px 1px at 65% 15%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 80% 60%, #ffe9a8, transparent),
      radial-gradient(1px 1px at 35% 75%, #fff, transparent),
      radial-gradient(2px 2px at 90% 40%, #fff, transparent);
    animation: parpadeo 4s ease-in-out infinite alternate;
  }

  @keyframes parpadeo {
    from { opacity: 0.4; }
    to   { opacity: 1; }
  }

  /* La escoba */
  .escoba {
    position: fixed;
    top: 25%;
    left: -15%;
    font-size: clamp(2.5rem, 9vw, 5rem);
    filter: drop-shadow(0 0 18px rgba(255, 190, 80, 0.75));
    animation: vuelo 9s linear infinite;
    will-change: transform;
  }

  @keyframes vuelo {
    0%   { transform: translate(0, 0) rotate(-12deg); }
    25%  { transform: translate(35vw, 14vh) rotate(6deg); }
    50%  { transform: translate(65vw, -8vh) rotate(-14deg); }
    75%  { transform: translate(95vw, 18vh) rotate(8deg); }
    100% { transform: translate(130vw, 0) rotate(-12deg); }
  }

  .contenido { position: relative; z-index: 2; padding: 1.5rem; }

  h1 {
    font-size: clamp(2rem, 8vw, 4.5rem);
    letter-spacing: 0.04em;
    text-shadow: 0 0 25px rgba(255, 190, 80, 0.5);
  }

  p {
    margin-top: 1rem;
    font-size: clamp(1rem, 3.5vw, 1.35rem);
    opacity: 0.85;
  }

  /* Respeta a quien prefiere menos movimiento */
  @media (prefers-reduced-motion: reduce) {
    .escoba, .estrellas { animation: none; }
    .escoba { left: 40%; top: 15%; }
  }
</style>
</head>
<body>
  <div class="estrellas"></div>
  <div class="escoba" aria-hidden="true">🧹</div>

  <main class="contenido">
    <h1>Bienvenido a Hogwarts</h1>
    <p>Sube a la escoba y mira al cielo.</p>
  </main>
</body>
</html>
